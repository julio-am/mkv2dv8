name: Build macOS test installer
on:
  push:
    branches: ["mkv-profile-converter-macos-test"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Confirm native Apple Silicon runtime
        run: python -c "import platform; assert platform.machine() == 'arm64'; print(platform.platform())"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -e ".[dev]"
      - name: Unit and GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m "not integration" -q --junitxml=macos-test-results.xml
      - name: Build app and portable archive
        run: python scripts/build.py --archive
      - name: Build Installer package
        run: python scripts/build_installer.py
      - name: Install package on runner
        run: sudo installer -pkg dist/MKV-Profile-Converter-macOS-arm64-Installer.pkg -target /
      - name: Check installed app and native startup
        run: python scripts/check_macos_bundle.py /Applications/MKVProfileConverter.app
      - name: Record checksums
        run: shasum -a 256 dist/MKV-Profile-Converter-*.zip dist/MKV-Profile-Converter-*.pkg > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MKV-Profile-Converter-macOS-arm64
          path: |
            desktop/dist/MKV-Profile-Converter-*.zip
            desktop/dist/MKV-Profile-Converter-*.pkg
            desktop/dist/SHA256SUMS.txt
            desktop/macos-test-results.xml
          if-no-files-found: error
          retention-days: 30
