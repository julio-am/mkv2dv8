name: Test and build desktop app
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
      - name: Install app and build dependencies
        run: python -m pip install -r requirements.txt -e ".[dev]"
      - name: Install macOS media tools for bundling
        if: runner.os == 'macOS'
        run: brew install dovi_tool mkvtoolnix ffmpeg media-info
      - name: Unit and GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m "not integration" -q
      - name: Build native distribution
        if: runner.os != 'macOS'
        run: python scripts/build.py --archive
      - name: Build complete macOS distribution
        if: runner.os == 'macOS'
        run: python scripts/build.py --bundle-media --archive
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build native installer
        if: runner.os != 'Linux'
        run: python scripts/build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: MKV-Profile-Converter-${{ matrix.os }}
          path: dist/MKV-Profile-Converter-*.*
          if-no-files-found: error
